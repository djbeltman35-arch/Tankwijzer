name: Prijzen in de site zetten
# Twee keer per dag de actuele prijzen van de live site in de repo zetten. Dat start een nieuwe Netlify-build,
# zodat ook de gidspagina's (en Google) de prijzen van vandaag hebben. Het ophalen zelf doet de Netlify-functie prijzen-ophalen.
on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prijzen ophalen van de site
        run: |
          curl -fsSL --retry 3 --max-time 30 https://goedkopertanken.netlify.app/data.json -o /tmp/data.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/data.json'))
          assert d.get('updated') and d.get('nl') and d.get('be'), 'onvolledig'
          oud = json.load(open('site/data-basis.json'))
          if d['updated'] <= oud.get('updated', ''): print('niets nieuws'); raise SystemExit(0)
          json.dump(d, open('site/data-basis.json', 'w'), ensure_ascii=False, indent=1)
          json.dump(d, open('data.json', 'w'), ensure_ascii=False, indent=1)  # voor oudere geïnstalleerde versies van de app
          print('bijgewerkt tot', d['updated'])
          PY
      - name: Duitse grensstations bijwerken (voor de pagina's per tankstation)
        continue-on-error: true
        run: python3 scripts/stations.py
      - name: Opslaan
        run: |
          git config user.name "Tankwijzer bot"; git config user.email "djbeltman35@users.noreply.github.com"
          git add site/data-basis.json data.json site/stations-basis.json
          git diff --cached --quiet || (git commit -m "Prijzen bijwerken $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M')" && git push)
      - name: Zoekmachines laten weten dat de prijzen nieuw zijn (IndexNow)
        continue-on-error: true
        run: |
          sleep 120
          B=https://goedkopertanken.netlify.app
          curl -fsS -m 30 -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"goedkopertanken.netlify.app\",\"key\":\"868c5d9481eb86e38cd82a9bd4c0764e\",\"keyLocation\":\"$B/868c5d9481eb86e38cd82a9bd4c0764e.txt\",\"urlList\":[\"$B/\",\"$B/gids/prijzen-vandaag.html\",\"$B/gids/grensplaatsen.html\",\"$B/gids/lpg-prijs-vandaag.html\",\"$B/tankstation/\"]}" && echo "IndexNow ok"
